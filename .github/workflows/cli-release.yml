name: CLI release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without the v prefix"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      API_VERSION: v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - run: pnpm install --frozen-lockfile
      - name: Verify seven-package release ownership
        run: node scripts/check-sdk-release-ownership.mjs

      - name: Resolve and validate version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid SemVer: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test CLI and npm launcher
        run: |
          (cd cli && go test ./...)
          node packages/cli/bin/resolve.test.js

      - name: Build and verify release bundle
        run: ./scripts/verify-cli-release.sh "${{ steps.release.outputs.version }}" "$API_VERSION"

      - name: Stage npm package binaries
        run: |
          mkdir -p release/cli-package
          pnpm --dir packages/cli pack --pack-destination release/cli-package
          tar -xzf release/cli-package/ghanageo-*.tgz -C release/cli-package
          cp cli/dist/ghanageo_* release/cli-package/package/bin/
          rm release/cli-package/package/bin/resolve.test.js
          node scripts/stamp-staged-sdk-package.mjs release/cli-package/package "${{ steps.release.outputs.version }}"
          (cd release/cli-package/package && npm pack --ignore-scripts --pack-destination ../../ >/dev/null)
          mv "release/ghanageo-${{ steps.release.outputs.version }}.tgz" packages/cli/
          if tar -tzf "packages/cli/ghanageo-${{ steps.release.outputs.version }}.tgz" | grep -q 'package/bin/resolve.test.js'; then
            echo "public umbrella tarball contains resolve.test.js" >&2
            exit 1
          fi
          for artifact in \
            ghanageo_darwin_amd64 ghanageo_darwin_arm64 \
            ghanageo_linux_amd64 ghanageo_linux_arm64 ghanageo_linux_arm \
            ghanageo_windows_amd64.exe ghanageo_windows_arm64.exe; do
            tar -tzf "packages/cli/ghanageo-${{ steps.release.outputs.version }}.tgz" | grep -qx "package/bin/$artifact"
          done

      - name: Generate Homebrew formula
        run: |
          mkdir -p release
          ./cli/release/homebrew-formula.sh "${{ steps.release.outputs.version }}" \
            cli/dist/checksums.txt > release/ghanageo.rb

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghanageo-cli-${{ steps.release.outputs.version }}
          path: |
            cli/dist/*
            packages/cli/ghanageo-${{ steps.release.outputs.version }}.tgz
            release/ghanageo.rb
