name: CLI release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without the v prefix"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      API_VERSION: v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - run: pnpm install --frozen-lockfile

      - name: Resolve and validate version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid SemVer: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test CLI and npm launcher
        run: |
          (cd cli && go test ./...)
          node packages/cli/bin/resolve.test.js

      - name: Build and verify release bundle
        run: ./scripts/verify-cli-release.sh "${{ steps.release.outputs.version }}" "$API_VERSION"

      - name: Stage npm package binaries
        run: |
          cp cli/dist/ghanageo_* packages/cli/bin/
          npm --prefix packages/cli version "${{ steps.release.outputs.version }}" --no-git-tag-version
          pnpm --dir packages/cli pack

      - name: Generate Homebrew formula
        run: |
          mkdir -p release
          ./cli/release/homebrew-formula.sh "${{ steps.release.outputs.version }}" \
            cli/dist/checksums.txt > release/ghanageo.rb

      - name: Publish npm package
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance packages/cli/ghanageo-${{ steps.release.outputs.version }}.tgz

      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            cli/dist/ghanageo_* cli/dist/checksums.txt \
            packages/cli/ghanageo-${{ steps.release.outputs.version }}.tgz \
            --verify-tag --generate-notes --title "GhanaGeo CLI $GITHUB_REF_NAME"

      - name: Update Homebrew tap
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [[ -n "$TAP_TOKEN" ]] || { echo "HOMEBREW_TAP_TOKEN is required" >&2; exit 1; }
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ghanageo/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp release/ghanageo.rb tap/Formula/ghanageo.rb
          cd tap
          git config user.name "ghanageo-release[bot]"
          git config user.email "ghanageo-release[bot]@users.noreply.github.com"
          git add Formula/ghanageo.rb
          git diff --cached --quiet && exit 0
          git commit -m "ghanageo $GITHUB_REF_NAME"
          git push origin HEAD:main

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ghanageo-cli-${{ steps.release.outputs.version }}
          path: |
            cli/dist/*
            packages/cli/ghanageo-${{ steps.release.outputs.version }}.tgz
            release/ghanageo.rb
