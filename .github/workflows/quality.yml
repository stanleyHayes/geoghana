name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref. Without this a
# busy branch queues runs that are already irrelevant.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  PNPM_VERSION: "11"

jobs:
  environment-generation:
    name: Production environment generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate generated secret isolation and shared service credentials
        run: ./scripts/test-gen-env.sh
      - name: Validate production Blueprint and fail-closed preflight behavior
        run: make production-blueprint-check

  licensed-data:
    name: GhanaPostGPS exclusion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject unlicensed digital-address data
        run: |
          ./scripts/check-ghanapost-exclusion.test.sh
          ./scripts/check-ghanapost-exclusion.sh

  go:
    name: Go build, vet and test
    runs-on: ubuntu-latest
    # The data layer is tested against REAL MongoDB, Redis and Typesense
    # rather than fakes. A BSON round-trip bug — which this project has had
    # more than once — is invisible to a mock.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6679:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      typesense:
        image: typesense/typesense:29.0
        ports: ["8108:8108"]
        env:
          TYPESENSE_API_KEY: ci-local-key
          TYPESENSE_DATA_DIR: /tmp/typesense
        options: >-
          --health-cmd "curl -f http://localhost:8108/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MONGO_URI: mongodb://127.0.0.1:27117/ghanageo?replicaSet=rs0&directConnection=true
      MONGO_DB: ghanageo
      GHANAGEO_REQUIRE_MONGO_TRANSACTIONS: "true"
      REDIS_URL: redis://127.0.0.1:6679/0
      TYPESENSE_URL: http://127.0.0.1:8108
      TYPESENSE_API_KEY: ci-local-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/api/go.sum
            services/worker/go.sum
      - name: Initialize MongoDB transaction-capable replica set
        run: |
          docker run --detach --name ghanageo-ci-mongo --publish 27117:27017 \
            mongo:8.0 --replSet rs0 --bind_ip_all
          for _ in {1..30}; do
            if docker exec ghanageo-ci-mongo mongosh --quiet --eval \
              'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec ghanageo-ci-mongo mongosh --quiet --eval \
            'try { rs.status() } catch (_) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}) }'
          for _ in {1..30}; do
            if docker exec ghanageo-ci-mongo mongosh --quiet --eval \
              'quit(db.hello().isWritablePrimary ? 0 : 1)'; then
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB replica set did not elect a primary" >&2
          exit 1
      - name: gofmt
        working-directory: services/api
        run: |
          # Generated files are excluded: they are the generator's output and
          # reformatting them would only drift from the next regeneration.
          unformatted=$(gofmt -l . | grep -v -E '(_gen\.go|/gen/)' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: Build
        run: |
          (cd services/api && go build ./...)
          (cd services/worker && go build ./...)
      - name: Vet
        run: |
          (cd services/api && go vet ./...)
          (cd services/worker && go vet ./...)
      - name: Test
        run: |
          (cd services/api && go test -race ./...)
          (cd services/worker && go test -race ./...)

  contracts:
    name: Contracts lint and drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/api/go.sum
      - uses: bufbuild/buf-action@e8b15693be91ae73e965d157c722987338c768b3 # v1
        with:
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: Reject protobuf breaking changes
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=${{ github.event.pull_request.base.ref }}"
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@latest lint contracts/openapi/v1.yaml
      - name: Generated contract artifacts are current
        run: |
          cd services/api && go run ./cmd/gencontracts ../..
          cd "$GITHUB_WORKSPACE"
          # The error catalog generates Go and TypeScript. If regenerating
          # changes anything, the committed artifacts are stale and the three
          # transports have already drifted apart.
          if ! git diff --exit-code; then
            echo "Generated contract artifacts are out of date. Run 'make contracts'."
            exit 1
          fi

  sdk-python:
    name: Python ${{ matrix.python }} release and conformance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: sdks/python/uv.lock
      - name: Locked release and live-fixture conformance
        run: make sdk-python-verify PYTHON_VERSION=${{ matrix.python }} REPORT=/tmp/ghanageo-python-${{ matrix.python }}-conformance.json
      - name: Upload directly generated Python conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-${{ matrix.python }}-conformance-report
          path: /tmp/ghanageo-python-${{ matrix.python }}-conformance.json
          if-no-files-found: error

  sdk-go:
    name: Go SDK release and conformance
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "33.2"
      - name: Install pinned protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Isolated release and live-fixture conformance
        run: make sdk-go-verify REPORT=/tmp/ghanageo-go-conformance.json GRPC_REPORT=/tmp/ghanageo-go-grpc-conformance.json
      - name: Upload directly generated Go conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-conformance-report
          path: /tmp/ghanageo-go-conformance.json
          if-no-files-found: error
      - name: Upload native gRPC conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-grpc-conformance-report
          path: /tmp/ghanageo-go-grpc-conformance.json
          if-no-files-found: error

  sdk-dart:
    name: Dart 3.13.2 release and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.2
      - name: Cache Dart packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: dart-3.13.2-${{ runner.os }}-${{ hashFiles('sdks/dart/pubspec.yaml') }}
          restore-keys: dart-3.13.2-${{ runner.os }}-
      - name: Core release and live-fixture conformance
        run: make sdk-dart-verify REPORT=/tmp/ghanageo-dart-conformance.json
      - name: Upload directly generated Dart conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dart-3.13.2-conformance-report
          path: /tmp/ghanageo-dart-conformance.json
          if-no-files-found: error

  sdk-flutter:
    name: Flutter 3.47.2 companion verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Companion release verification
        run: make sdk-flutter-verify

  sdk-java:
    name: Java 21 release and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            sdks/java/**/pom.xml
            sdks/java/contract.lock
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Maven, Gradle, contract-lock and live-fixture verification
        run: make sdk-java-verify REPORT=/tmp/ghanageo-java-conformance.json
      - name: Upload directly generated Java conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-21-conformance-report
          path: /tmp/ghanageo-java-conformance.json
          if-no-files-found: error

  sdk-dotnet:
    name: .NET 8 release and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.403
          cache: true
          cache-dependency-path: sdks/dotnet/**/packages.lock.json
      - name: Locked net8 release and live-fixture conformance
        run: make sdk-dotnet-verify REPORT=/tmp/ghanageo-dotnet-conformance.json
      - name: Upload directly generated .NET conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-8-conformance-report
          path: /tmp/ghanageo-dotnet-conformance.json
          if-no-files-found: error

  sdk-php:
    name: PHP ${{ matrix.php }} release and conformance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: php-${{ matrix.php }}-${{ runner.os }}-${{ hashFiles('sdks/php/composer.lock') }}
          restore-keys: php-${{ matrix.php }}-${{ runner.os }}-
      - name: PHPUnit, PHPStan, Pint, archive, consumer and live conformance
        run: make sdk-php-verify REPORT=/tmp/ghanageo-php-${{ matrix.php }}-conformance.json
      - name: Upload directly generated PHP conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: php-${{ matrix.php }}-conformance-report
          path: /tmp/ghanageo-php-${{ matrix.php }}-conformance.json
          if-no-files-found: error

  sdk-conformance-matrix:
    name: Complete GEO-24.1M conformance matrix
    runs-on: ubuntu-latest
    if: always()
    needs: [sdk-python, sdk-go, sdk-dart, sdk-java, sdk-dotnet, sdk-php, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every producing job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          ruby -rjson -e 'failed = JSON.parse(ENV.fetch("NEEDS_JSON")).select { |_name, job| job.fetch("result") != "success" }; abort("conformance producer jobs failed: #{failed.keys.join(", ")}") unless failed.empty?'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-conformance-report"
          path: /tmp/ghanageo-sdk-matrix
      - name: Validate runner completeness, protocol coverage and parity
        run: make conformance-matrix REPORT_DIR=/tmp/ghanageo-sdk-matrix

  sdk-docs:
    name: SDK documentation drift and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "sdks/java/**/pom.xml"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: sdks/dotnet/global.json
          cache: true
          cache-dependency-path: "sdks/dotnet/**/packages.lock.json"
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Install locked workspace and example dependencies
        run: |
          pnpm install --frozen-lockfile
          (cd sdks/dart && dart pub get)
          dotnet restore sdks/dotnet/GhanaGeo.sln --locked-mode
          dotnet restore sdks/dotnet/examples/ConsoleExample/ConsoleExample.csproj
      - name: Verify generated SDK docs and every extracted example
        run: make docs-sdk-check

  web:
    name: Typecheck, test, build and link integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SDK conformance contract and TypeScript reference runner
        run: make conformance
        env:
          GHANAGEO_CONFORMANCE_REPORT: /tmp/ghanageo-typescript-conformance.json
      - name: Upload directly generated TypeScript conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typescript-conformance-report
          path: /tmp/ghanageo-typescript-conformance.json
          if-no-files-found: error
      - name: Generated SDK artifacts are current
        run: |
          pnpm --filter @ghanageo/core generate
          pnpm --filter @ghanageo/data generate
          pnpm --filter @ghanageo/proto generate
          git diff --exit-code \
            packages/core/src/openapi.gen.ts \
            packages/data/src/data.json \
            packages/proto/src/gen \
            packages/proto/proto
      - run: pnpm -w typecheck
      - run: pnpm -w test
      - run: pnpm -w build
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.mod
      - name: Seven-artifact SDK release dry run
        run: ./scripts/verify-sdk-release.sh "$(node -p "require('./packages/client/package.json').version")"
      - name: Link integrity
        # Fails on a dead link AND on a route nothing links to. /docs once
        # shipped unreachable: it built, returned 200, and no page pointed at
        # it. A 404 is loud; an orphan is silent.
        run: node scripts/check-links.mjs

  design-qa:
    name: Design QA (180-point matrix)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27117:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6679:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      typesense:
        image: typesense/typesense:29.0
        ports: ["8108:8108"]
        env:
          TYPESENSE_API_KEY: ci-local-key
          TYPESENSE_DATA_DIR: /tmp/typesense
        options: >-
          --health-cmd "curl -f http://localhost:8108/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MONGO_URI: mongodb://127.0.0.1:27117/ghanageo?directConnection=true
      MONGO_DB: ghanageo
      REDIS_URL: redis://127.0.0.1:6679/0
      TYPESENSE_URL: http://127.0.0.1:8108
      TYPESENSE_API_KEY: ci-local-key
      ALLOWED_ORIGINS: http://localhost:3100,http://localhost:3101,http://localhost:3102,http://localhost:3103
      NEXT_PUBLIC_GHANAGEO_API_URL: http://localhost:8180/v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/api/go.sum
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prepare local API
        working-directory: services/api
        run: |
          go run ./cmd/ghanageo-admin migrate
          go run ./cmd/ghanageo-admin data seed --file ../../data/seed-data/manifest.json
          go build -o /tmp/ghanageo-api ./cmd/api
          /tmp/ghanageo-api > /tmp/ghanageo-api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl --fail --silent http://localhost:8180/health && exit 0
            sleep 1
          done
          cat /tmp/ghanageo-api.log
          exit 1
      - name: Build and start frontend surfaces
        run: |
          pnpm -w build
          pnpm --filter @ghanageo/web start > /tmp/ghanageo-web.log 2>&1 &
          pnpm --filter @ghanageo/sandbox start > /tmp/ghanageo-sandbox.log 2>&1 &
          pnpm --filter @ghanageo/portal start > /tmp/ghanageo-portal.log 2>&1 &
          pnpm --filter @ghanageo/admin start > /tmp/ghanageo-admin.log 2>&1 &
          for port in 3100 3101 3102 3103; do
            for _ in $(seq 1 60); do
              curl --fail --silent "http://localhost:${port}" > /dev/null && break
              sleep 1
            done
            curl --fail --silent "http://localhost:${port}" > /dev/null || {
              cat /tmp/ghanageo-*.log
              exit 1
            }
          done
      - name: Axe and responsive material/theme matrix
        run: pnpm --filter @ghanageo/ui design:qa

  indexes:
    name: Query plans use indexes
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27117:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MONGO_URI: mongodb://127.0.0.1:27117/ghanageo?directConnection=true
      MONGO_DB: ghanageo
      PERF_MONGO_URI: mongodb://127.0.0.1:27117/ghanageo?directConnection=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/api/go.sum
      - name: Migrate and seed
        working-directory: services/api
        run: |
          go run ./cmd/ghanageo-admin migrate
          go run ./cmd/ghanageo-admin data seed --file ../../data/seed-data/manifest.json
      - name: Assert IXSCAN, never COLLSCAN
        working-directory: services/api
        # A query can meet its p95 on a small dataset while doing a collection
        # scan, then fall over as the data grows. Latency alone cannot see it.
        run: go test ./perf/ -run TestHotQueriesUseIndexes -v
