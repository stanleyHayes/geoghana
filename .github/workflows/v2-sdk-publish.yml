name: V2 SDK protected publishing
on:
  workflow_call:
    inputs:
      version: { required: true, type: string }
      commit: { required: true, type: string }
      artifact-name: { required: true, type: string }
permissions: { contents: write, actions: read, id-token: write, attestations: read }
jobs:
  publish-sequentially:
    runs-on: ubuntu-latest
    environment: sdk-release
    env:
      GH_TOKEN: ${{ secrets.SDK_RELEASE_GITHUB_TOKEN }}
      SOURCE_GIT_SIGNING_KEY: ${{ secrets.SOURCE_GIT_SIGNING_KEY }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
      GO_SDK_REPOSITORY: ghanageo/ghanageo-go
      PHP_SDK_REPOSITORY: ghanageo/ghanageo-php
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: "${{ inputs.artifact-name }}", path: bundle }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with: { name: "release-ledger-${{ inputs.version }}", path: . }
      - name: Verify exact signer, commit, manifest and artifact bytes
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          while IFS= read -r -d '' file; do gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/v2-sdk-release.yml"; done < <(find bundle -type f -print0)
          node scripts/verify-sdk-release-bundle.mjs bundle "${{ inputs.version }}" "${{ inputs.commit }}"
          node scripts/sdk-release-ledger.mjs init release-ledger.json bundle/compatibility-manifest.json
      - name: Resolve exact independent SDK versions
        run: |
          # shellcheck disable=SC2016
          node -e 'const m=require("./bundle/compatibility-manifest.json"); for(const [k,v] of Object.entries({JAVA_VERSION:m.sdks.java.codeVersion,GO_VERSION:m.sdks.go.codeVersion,PHP_VERSION:m.sdks.php.codeVersion,PYTHON_VERSION:m.sdks.python.codeVersion,DOTNET_VERSION:m.sdks.dotnet.codeVersion,DART_VERSION:m.sdks.dart.codeVersion,FLUTTER_VERSION:m.sdks.flutter.codeVersion})) console.log(`${k}=${v}`)' >> "$GITHUB_ENV"
      - id: state
        name: Read digest-bound resumable release ledger
        run: for checkpoint in npm-core npm-client npm-react npm-node npm-data npm-proto npm-umbrella pub-core pub maven nuget pypi go-source php-source go-dispatch packagist github-release; do value=false; node scripts/sdk-release-ledger.mjs has release-ledger.json "$checkpoint" && value=true; echo "${checkpoint//-/_}=$value" >> "$GITHUB_OUTPUT"; done
      - name: Complete all-registry preflight before mutation
        env:
          NPM_NAMESPACE_VERIFIED: ${{ vars.NPM_NAMESPACE_VERIFIED }}
          PYPI_NAMESPACE_VERIFIED: ${{ vars.PYPI_NAMESPACE_VERIFIED }}
          PUB_NAMESPACE_VERIFIED: ${{ vars.PUB_NAMESPACE_VERIFIED }}
          MAVEN_NAMESPACE_VERIFIED: ${{ vars.MAVEN_NAMESPACE_VERIFIED }}
          NUGET_NAMESPACE_VERIFIED: ${{ vars.NUGET_NAMESPACE_VERIFIED }}
          PACKAGIST_NAMESPACE_VERIFIED: ${{ vars.PACKAGIST_NAMESPACE_VERIFIED }}
          GO_EXPORT_VERIFIED: ${{ vars.GO_EXPORT_VERIFIED }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          PUB_DONE: ${{ steps.state.outputs.pub }}
          PUB_CORE_DONE: ${{ steps.state.outputs.pub_core }}
          MAVEN_DONE: ${{ steps.state.outputs.maven }}
          NUGET_DONE: ${{ steps.state.outputs.nuget }}
          PYPI_DONE: ${{ steps.state.outputs.pypi }}
          GO_SOURCE_DONE: ${{ steps.state.outputs.go_source }}
          PHP_SOURCE_DONE: ${{ steps.state.outputs.php_source }}
          PACKAGIST_DONE: ${{ steps.state.outputs.packagist }}
        run: |
          for flag in NPM_NAMESPACE_VERIFIED PYPI_NAMESPACE_VERIFIED PUB_NAMESPACE_VERIFIED MAVEN_NAMESPACE_VERIFIED NUGET_NAMESPACE_VERIFIED PACKAGIST_NAMESPACE_VERIFIED GO_EXPORT_VERIFIED; do [[ "${!flag:-}" == true ]] || { echo "$flag is a protected release-owner readiness assertion and must be true" >&2; exit 1; }; done
          for value in GH_TOKEN SOURCE_GIT_SIGNING_KEY MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_TOKEN MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE NUGET_API_KEY PACKAGIST_TOKEN GO_SDK_REPOSITORY PHP_SDK_REPOSITORY; do [[ -n "${!value:-}" ]] || { echo "$value is missing" >&2; exit 1; }; done
          # npm, PyPI and pub.dev trusted publishing exchanges OIDC only during publish;
          # their protected variables are owner assertions, not authentication probes.
          for repository in "$GO_SDK_REPOSITORY" "$PHP_SDK_REPOSITORY"; do [[ "$(gh api "repos/$repository" --jq .permissions.push)" == true ]] || { echo "no push permission for $repository" >&2; exit 1; }; done
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .permissions.push)" == true ]] || { echo "release token cannot create the GitHub release" >&2; exit 1; }
          release_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v${{ inputs.version }}" --jq .object.sha)"
          release_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v${{ inputs.version }}" --jq .object.type)"
          if [[ "$release_type" == tag ]]; then release_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$release_object" --jq .object.sha)"; fi
          [[ "$release_object" == "${{ inputs.commit }}" ]] || { echo "release tag does not reference the rehearsed commit" >&2; exit 1; }
          for package in core client react node data proto; do checkpoint="npm-$package"; found=false; npm view "@ghanageo/$package@${{ inputs.version }}" version >/dev/null 2>&1 && found=true; recorded=false; node scripts/sdk-release-ledger.mjs has release-ledger.json "$checkpoint" && recorded=true; if [[ "$found" == true && "$recorded" == false ]]; then echo "npm package exists without a checkpoint; publish step will verify its exact dist integrity before accepting it"; elif [[ "$found" == false && "$recorded" == true ]]; then echo "npm checkpoint exists but package is absent" >&2; exit 1; fi; done
          found=false; npm view "ghanageo@${{ inputs.version }}" version >/dev/null 2>&1 && found=true; recorded=false; node scripts/sdk-release-ledger.mjs has release-ledger.json npm-umbrella && recorded=true; if [[ "$found" == false && "$recorded" == true ]]; then echo "npm umbrella checkpoint exists but package is absent" >&2; exit 1; fi
          found=false; [[ "$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/ghanageo/$PYTHON_VERSION/json")" == 200 ]] && found=true; [[ "$found" == false || "$PYPI_DONE" == true ]] || { ./scripts/record-sdk-registry-evidence.sh pypi release-ledger.json pypi "$PYTHON_VERSION" bundle/python; echo PYPI_RECOVERED=true >> "$GITHUB_ENV"; }; [[ "$found" == true || "$PYPI_DONE" == false ]] || { echo "PyPI checkpoint exists but version is absent" >&2; exit 1; }
          for spec in "ghanageo:$DART_VERSION:$PUB_CORE_DONE:pub-core:PUB_CORE_RECOVERED" "ghanageo_flutter:$FLUTTER_VERSION:$PUB_DONE:pub:PUB_RECOVERED"; do package="${spec%%:*}"; rest="${spec#*:}"; wanted="${rest%%:*}"; rest="${rest#*:}"; expected="${rest%%:*}"; rest="${rest#*:}"; checkpoint="${rest%%:*}"; recovery="${rest#*:}"; found=false; curl -fsSL "https://pub.dev/api/packages/$package" | ruby -rjson -e 'wanted=ARGV[0]; exit(JSON.parse(STDIN.read).fetch("versions",[]).any? { |v| v["version"]==wanted } ? 0 : 1)' "$wanted" && found=true; if [[ "$found" == true && "$expected" == false ]]; then ./scripts/record-sdk-registry-evidence.sh pub release-ledger.json "$checkpoint" "$wanted" "$package"; echo "$recovery=true" >> "$GITHUB_ENV"; elif [[ "$found" == false && "$expected" == true ]]; then echo "pub.dev checkpoint exists but version is absent" >&2; exit 1; fi; done
          maven_found=true; for artifact in ghanageo-java ghanageo-spring-boot-starter; do [[ "$(curl -sS -o /dev/null -w '%{http_code}' "https://repo1.maven.org/maven2/dev/ghanageo/$artifact/$JAVA_VERSION/$artifact-$JAVA_VERSION.pom")" == 200 ]] || maven_found=false; done; if [[ "$maven_found" == true && "$MAVEN_DONE" == false ]]; then mkdir -p java; tar -xzf "bundle/java/ghanageo-java-${{ inputs.version }}-maven-bundle.tar.gz" -C java; ./scripts/record-sdk-registry-evidence.sh maven release-ledger.json maven "$JAVA_VERSION" java; echo MAVEN_RECOVERED=true >> "$GITHUB_ENV"; elif [[ "$maven_found" == false && "$MAVEN_DONE" == true ]]; then echo "Maven checkpoint exists but version is absent" >&2; exit 1; fi
          found=false; curl -fsSL https://api.nuget.org/v3-flatcontainer/ghanageo/index.json | ruby -rjson -e 'wanted=ARGV[0]; exit(JSON.parse(STDIN.read).fetch("versions",[]).include?(wanted.downcase) ? 0 : 1)' "$DOTNET_VERSION" && found=true; if [[ "$found" == true && "$NUGET_DONE" == false ]]; then ./scripts/record-sdk-registry-evidence.sh nuget release-ledger.json nuget "$DOTNET_VERSION" bundle/dotnet; echo NUGET_RECOVERED=true >> "$GITHUB_ENV"; elif [[ "$found" == false && "$NUGET_DONE" == true ]]; then echo "NuGet checkpoint exists but version is absent" >&2; exit 1; fi
          found=false; curl -fsSL https://repo.packagist.org/p2/ghanageo/ghanageo-php.json | ruby -rjson -e 'wanted=ARGV[0]; versions=JSON.parse(STDIN.read).fetch("packages",{}).values.flatten; exit(versions.any? { |v| v["version_normalized"]&.start_with?(wanted) || v["version"]==wanted } ? 0 : 1)' "$PHP_VERSION" && found=true; if [[ "$found" == true && "$PACKAGIST_DONE" == false ]]; then ./scripts/record-sdk-registry-evidence.sh packagist release-ledger.json packagist "$PHP_VERSION" "$PHP_SDK_REPOSITORY"; echo PACKAGIST_RECOVERED=true >> "$GITHUB_ENV"; elif [[ "$found" == false && "$PACKAGIST_DONE" == true ]]; then echo "Packagist checkpoint exists but version is absent" >&2; exit 1; fi
          found=false; [[ -n "$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GO_SDK_REPOSITORY}.git" "refs/tags/v$GO_VERSION")" ]] && found=true; if [[ "$found" == true && "$GO_SOURCE_DONE" == false ]]; then VERIFY_ONLY=true ./scripts/export-sdk-source-release.sh go "bundle/go/ghanageo-go-${{ inputs.version }}.tar.gz" "$GO_VERSION" "$GO_SDK_REPOSITORY" > go-tree.txt; node -e 'require("fs").writeFileSync("evidence.json",JSON.stringify({registry:"github-source",repository:process.argv[1],version:process.argv[2],tree:require("fs").readFileSync("go-tree.txt","utf8").trim()}))' "$GO_SDK_REPOSITORY" "$GO_VERSION"; node scripts/sdk-release-ledger.mjs complete release-ledger.json _ go-source evidence.json; echo GO_SOURCE_RECOVERED=true >> "$GITHUB_ENV"; elif [[ "$found" == false && "$GO_SOURCE_DONE" == true ]]; then echo "Go source checkpoint exists but tag is absent" >&2; exit 1; fi
          found=false; [[ -n "$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${PHP_SDK_REPOSITORY}.git" "refs/tags/v$PHP_VERSION")" ]] && found=true; if [[ "$found" == true && "$PHP_SOURCE_DONE" == false ]]; then php_archive="$(find bundle/php -maxdepth 1 -name '*.zip' -print -quit)"; VERIFY_ONLY=true ./scripts/export-sdk-source-release.sh php "$php_archive" "$PHP_VERSION" "$PHP_SDK_REPOSITORY" > php-tree.txt; node -e 'require("fs").writeFileSync("evidence.json",JSON.stringify({registry:"github-source",repository:process.argv[1],version:process.argv[2],tree:require("fs").readFileSync("php-tree.txt","utf8").trim()}))' "$PHP_SDK_REPOSITORY" "$PHP_VERSION"; node scripts/sdk-release-ledger.mjs complete release-ledger.json _ php-source evidence.json; echo PHP_SOURCE_RECOVERED=true >> "$GITHUB_ENV"; elif [[ "$found" == false && "$PHP_SOURCE_DONE" == true ]]; then echo "PHP source checkpoint exists but tag is absent" >&2; exit 1; fi
          if [[ "$GO_SOURCE_DONE" == true ]]; then
            VERIFY_ONLY=true ./scripts/export-sdk-source-release.sh go "bundle/go/ghanageo-go-${{ inputs.version }}.tar.gz" "$GO_VERSION" "$GO_SDK_REPOSITORY" > go-tree.txt
            node -e 'require("fs").writeFileSync("evidence.json",JSON.stringify({registry:"github-source",repository:process.argv[1],version:process.argv[2],tree:require("fs").readFileSync("go-tree.txt","utf8").trim()}))' "$GO_SDK_REPOSITORY" "$GO_VERSION"
            node scripts/sdk-release-ledger.mjs complete release-ledger.json _ go-source evidence.json
          fi
          if [[ "$PHP_SOURCE_DONE" == true ]]; then
            php_archive="$(find bundle/php -maxdepth 1 -name '*.zip' -print -quit)"
            VERIFY_ONLY=true ./scripts/export-sdk-source-release.sh php "$php_archive" "$PHP_VERSION" "$PHP_SDK_REPOSITORY" > php-tree.txt
            node -e 'require("fs").writeFileSync("evidence.json",JSON.stringify({registry:"github-source",repository:process.argv[1],version:process.argv[2],tree:require("fs").readFileSync("php-tree.txt","utf8").trim()}))' "$PHP_SDK_REPOSITORY" "$PHP_VERSION"
            node scripts/sdk-release-ledger.mjs complete release-ledger.json _ php-source evidence.json
          fi
          go_proxy_found=false; [[ "$(curl -sS -o /dev/null -w '%{http_code}' "https://proxy.golang.org/github.com%2Fghanageo%2Fghanageo-go/@v/v$GO_VERSION.info")" == 200 ]] && go_proxy_found=true
          if [[ "$go_proxy_found" == true && "${{ steps.state.outputs.go_dispatch }}" == false ]]; then [[ -s go-tree.txt ]] || VERIFY_ONLY=true ./scripts/export-sdk-source-release.sh go "bundle/go/ghanageo-go-${{ inputs.version }}.tar.gz" "$GO_VERSION" "$GO_SDK_REPOSITORY" > go-tree.txt; ./scripts/record-sdk-registry-evidence.sh go release-ledger.json go-dispatch "$GO_VERSION" "$(tail -1 go-tree.txt)"; echo GO_DISPATCH_RECOVERED=true >> "$GITHUB_ENV"; elif [[ "$go_proxy_found" == false && "${{ steps.state.outputs.go_dispatch }}" == true ]]; then echo "Go dispatch checkpoint exists but proxy version is absent" >&2; exit 1; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with: { sdk: 3.13.2 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", server-id: central, server-username: MAVEN_CENTRAL_USERNAME, server-password: MAVEN_CENTRAL_TOKEN, gpg-private-key: "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}", gpg-passphrase: MAVEN_GPG_PASSPHRASE }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      - name: Re-verify completed registry evidence before any mutation
        run: |
          [[ "${{ steps.state.outputs.pypi }}" != true ]] || ./scripts/record-sdk-registry-evidence.sh pypi release-ledger.json pypi "$PYTHON_VERSION" bundle/python
          [[ "${{ steps.state.outputs.nuget }}" != true ]] || ./scripts/record-sdk-registry-evidence.sh nuget release-ledger.json nuget "$DOTNET_VERSION" bundle/dotnet
          [[ "${{ steps.state.outputs.pub_core }}" != true ]] || ./scripts/record-sdk-registry-evidence.sh pub release-ledger.json pub-core "$DART_VERSION" ghanageo
          [[ "${{ steps.state.outputs.pub }}" != true ]] || ./scripts/record-sdk-registry-evidence.sh pub release-ledger.json pub "$FLUTTER_VERSION" ghanageo_flutter
          if [[ "${{ steps.state.outputs.maven }}" == true ]]; then mkdir -p java; tar -xzf "bundle/java/ghanageo-java-${{ inputs.version }}-maven-bundle.tar.gz" -C java; ./scripts/record-sdk-registry-evidence.sh maven release-ledger.json maven "$JAVA_VERSION" java; fi
          if [[ "${{ steps.state.outputs.go_dispatch }}" == true ]]; then [[ -s go-tree.txt ]] || VERIFY_ONLY=true ./scripts/export-sdk-source-release.sh go "bundle/go/ghanageo-go-${{ inputs.version }}.tar.gz" "$GO_VERSION" "$GO_SDK_REPOSITORY" > go-tree.txt; ./scripts/record-sdk-registry-evidence.sh go release-ledger.json go-dispatch "$GO_VERSION" "$(tail -1 go-tree.txt)"; fi
          [[ "${{ steps.state.outputs.packagist }}" != true ]] || ./scripts/record-sdk-registry-evidence.sh packagist release-ledger.json packagist "$PHP_VERSION" "$PHP_SDK_REPOSITORY"
      - name: Publish scoped npm packages, wait, then publish CLI umbrella
        run: npm install --global npm@11.5.1 && ./scripts/publish-npm-sdk-bundle.sh bundle "${{ inputs.version }}" release-ledger.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "release-ledger-${{ inputs.version }}", path: release-ledger.json, overwrite: true }
      - name: Publish Dart core through pub.dev OIDC
        if: steps.state.outputs.pub_core != 'true' && steps.state.outputs.pub != 'true' && env.PUB_CORE_RECOVERED != 'true'
        run: mkdir -p publish/dart && tar -xzf "bundle/dart/ghanageo-${{ inputs.version }}.tar.gz" -C publish/dart && (cd publish/dart && dart pub publish --force)
      - name: Wait for Dart core registry visibility
        if: steps.state.outputs.pub_core != 'true' && steps.state.outputs.pub != 'true' && env.PUB_CORE_RECOVERED != 'true'
        run: |
          for _attempt in {1..30}; do [[ "$(curl -fsSL https://pub.dev/api/packages/ghanageo | ruby -rjson -e 'puts JSON.parse(STDIN.read).dig("latest","version")')" == "$DART_VERSION" ]] && exit 0; sleep 10; done
          echo "Dart core did not become visible; Flutter was not published" >&2; exit 1
      - if: steps.state.outputs.pub_core != 'true' && steps.state.outputs.pub != 'true' && env.PUB_CORE_RECOVERED != 'true'
        run: ./scripts/record-sdk-registry-evidence.sh pub release-ledger.json pub-core "$DART_VERSION" ghanageo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "release-ledger-${{ inputs.version }}", path: release-ledger.json, overwrite: true }
      - name: Publish Flutter companion after Dart core
        if: steps.state.outputs.pub != 'true' && env.PUB_RECOVERED != 'true'
        run: |
          mkdir -p publish/flutter && tar -xzf "bundle/dart/ghanageo_flutter-${{ inputs.version }}.tar.gz" -C publish/flutter && (cd publish/flutter && dart pub publish --force)
          for _attempt in {1..30}; do [[ "$(curl -fsSL https://pub.dev/api/packages/ghanageo_flutter | ruby -rjson -e 'puts JSON.parse(STDIN.read).dig("latest","version")')" == "$FLUTTER_VERSION" ]] && { ./scripts/record-sdk-registry-evidence.sh pub release-ledger.json pub "$FLUTTER_VERSION" ghanageo_flutter; exit 0; }; sleep 10; done
          echo "Flutter package did not become visible" >&2; exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "release-ledger-${{ inputs.version }}", path: release-ledger.json, overwrite: true }
      - name: Publish exact staged Maven reactor
        if: steps.state.outputs.maven != 'true' && env.MAVEN_RECOVERED != 'true'
        run: mkdir java && tar -xzf "bundle/java/ghanageo-java-${{ inputs.version }}-maven-bundle.tar.gz" -C java && (cd java && ./mvnw -Pcentral-release -DskipTests deploy)
      - name: Confirm Maven Central published exact Java version
        if: steps.state.outputs.maven != 'true' && env.MAVEN_RECOVERED != 'true'
        run: |
          for _attempt in {1..60}; do curl -fsSL "https://repo1.maven.org/maven2/dev/ghanageo/ghanageo-java/$JAVA_VERSION/ghanageo-java-$JAVA_VERSION.pom" >/dev/null && curl -fsSL "https://repo1.maven.org/maven2/dev/ghanageo/ghanageo-spring-boot-starter/$JAVA_VERSION/ghanageo-spring-boot-starter-$JAVA_VERSION.pom" >/dev/null && exit 0; sleep 10; done
          echo "Maven Central did not report the published Java version" >&2; exit 1
      - if: steps.state.outputs.maven != 'true' && env.MAVEN_RECOVERED != 'true'
        run: ./scripts/record-sdk-registry-evidence.sh maven release-ledger.json maven "$JAVA_VERSION" java
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "release-ledger-${{ inputs.version }}", path: release-ledger.json, overwrite: true }
      - name: Publish NuGet package and symbols
        if: steps.state.outputs.nuget != 'true' && env.NUGET_RECOVERED != 'true'
        run: |
          for package in bundle/dotnet/*.nupkg; do [[ "$package" == *.snupkg ]] || dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json; done
          for _attempt in {1..30}; do curl -fsSL https://api.nuget.org/v3-flatcontainer/ghanageo/index.json | ruby -rjson -e 'wanted=ARGV[0]; exit(JSON.parse(STDIN.read).fetch("versions",[]).include?(wanted.downcase) ? 0 : 1)' "$DOTNET_VERSION" && { ./scripts/record-sdk-registry-evidence.sh nuget release-ledger.json nuget "$DOTNET_VERSION" bundle/dotnet; exit 0; }; sleep 10; done
          echo "NuGet version did not become visible" >&2; exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "release-ledger-${{ inputs.version }}", path: release-ledger.json, overwrite: true }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: steps.state.outputs.pypi != 'true' && env.PYPI_RECOVERED != 'true'
        with: { packages-dir: bundle/python, attestations: true }
      - if: steps.state.outputs.pypi != 'true' && env.PYPI_RECOVERED != 'true'
        run: ./scripts/record-sdk-registry-evidence.sh pypi release-ledger.json pypi "$PYTHON_VERSION" bundle/python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "release-ledger-${{ inputs.version }}", path: release-ledger.json, overwrite: true }
      - name: Export, signed-tag and verify exact Go source tree late
        if: steps.state.outputs.go_source != 'true' && env.GO_SOURCE_RECOVERED != 'true'
        run: |
          ./scripts/export-sdk-source-release.sh go "bundle/go/ghanageo-go-${{ inputs.version }}.tar.gz" "$GO_VERSION" "$GO_SDK_REPOSITORY" > go-tree.txt
          node -e 'require("fs").writeFileSync("evidence.json",JSON.stringify({registry:"github-source",repository:process.argv[1],version:process.argv[2],tree:require("fs").readFileSync("go-tree.txt","utf8").trim()}))' "$GO_SDK_REPOSITORY" "$GO_VERSION"
          node scripts/sdk-release-ledger.mjs complete release-ledger.json _ go-source evidence.json
      - name: Export, signed-tag and verify exact PHP source tree late
        if: steps.state.outputs.php_source != 'true' && env.PHP_SOURCE_RECOVERED != 'true'
        run: |
          php_archive="$(find bundle/php -maxdepth 1 -name '*.zip' -print -quit)"
          ./scripts/export-sdk-source-release.sh php "$php_archive" "$PHP_VERSION" "$PHP_SDK_REPOSITORY" > php-tree.txt
          node -e 'require("fs").writeFileSync("evidence.json",JSON.stringify({registry:"github-source",repository:process.argv[1],version:process.argv[2],tree:require("fs").readFileSync("php-tree.txt","utf8").trim()}))' "$PHP_SDK_REPOSITORY" "$PHP_VERSION"
          node scripts/sdk-release-ledger.mjs complete release-ledger.json _ php-source evidence.json
      - name: Dispatch Go registry release for verified source tree
        if: steps.state.outputs.go_dispatch != 'true' && env.GO_DISPATCH_RECOVERED != 'true'
        run: |
          VERIFY_ONLY=true ./scripts/export-sdk-source-release.sh go "bundle/go/ghanageo-go-${{ inputs.version }}.tar.gz" "$GO_VERSION" "$GO_SDK_REPOSITORY" > go-tree.txt
          gh api --method POST "repos/$GO_SDK_REPOSITORY/dispatches" -f event_type=ghanageo-sdk-release -f "client_payload[version]=$GO_VERSION" -f "client_payload[tree]=$(tail -1 go-tree.txt)" -f "client_payload[source_commit]=${{ inputs.commit }}"
          escaped_module="github.com%2Fghanageo%2Fghanageo-go"
          for _attempt in {1..30}; do curl -fsSL "https://proxy.golang.org/$escaped_module/@v/v$GO_VERSION.info" > go-info.json && curl -fsSL "https://proxy.golang.org/$escaped_module/@v/v$GO_VERSION.zip" > go-module.zip && break; sleep 10; done
          [[ -s go-module.zip ]] || { echo "Go proxy did not expose the dispatched version" >&2; exit 1; }
          ./scripts/record-sdk-registry-evidence.sh go release-ledger.json go-dispatch "$GO_VERSION" "$(tail -1 go-tree.txt)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "release-ledger-${{ inputs.version }}", path: release-ledger.json, overwrite: true }
      - name: Refresh Packagist only after verified PHP signed tag
        if: steps.state.outputs.packagist != 'true' && env.PACKAGIST_RECOVERED != 'true'
        run: |
          curl --fail-with-body --request POST --header 'content-type:application/json' --data "{\"repository\":{\"url\":\"https://github.com/$PHP_SDK_REPOSITORY\"}}" "https://packagist.org/api/update-package?username=ghanageo&apiToken=$PACKAGIST_TOKEN"
          for _attempt in {1..30}; do
            curl -fsSL https://repo.packagist.org/p2/ghanageo/ghanageo-php.json > packagist.json
            tag_object="$(gh api "repos/$PHP_SDK_REPOSITORY/git/ref/tags/v$PHP_VERSION" --jq .object.sha)"; tag_type="$(gh api "repos/$PHP_SDK_REPOSITORY/git/ref/tags/v$PHP_VERSION" --jq .object.type)"; [[ "$tag_type" == tag ]] && tag_object="$(gh api "repos/$PHP_SDK_REPOSITORY/git/tags/$tag_object" --jq .object.sha)"
            if ruby -rjson -e 'wanted,commit=ARGV; versions=JSON.parse(STDIN.read).fetch("packages",{}).values.flatten; exit(versions.any? { |v| (v["version_normalized"]&.start_with?(wanted) || v["version"]==wanted) && (v.dig("source","reference")==commit || v.dig("dist","reference")==commit) } ? 0 : 1)' "$PHP_VERSION" "$tag_object" < packagist.json; then
              ./scripts/record-sdk-registry-evidence.sh packagist release-ledger.json packagist "$PHP_VERSION" "$PHP_SDK_REPOSITORY"; exit 0
            fi
            sleep 10
          done
          echo "Packagist version did not become visible" >&2; exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "release-ledger-${{ inputs.version }}", path: release-ledger.json, overwrite: true }
      - name: Publish CLI GitHub release from same attested umbrella bundle
        env: { GH_TOKEN: "${{ github.token }}" }
        run: ./scripts/publish-github-sdk-release.sh "${{ inputs.version }}" "${{ inputs.commit }}" "bundle/npm/ghanageo-${{ inputs.version }}.tgz" release-ledger.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "release-ledger-${{ inputs.version }}", path: release-ledger.json, overwrite: true }
