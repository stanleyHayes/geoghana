name: TypeScript SDK release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without the v prefix"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - name: Verify seven-package release ownership
        run: node scripts/check-sdk-release-ownership.mjs

      - name: Resolve and validate version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid SemVer: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify source, tests and consumer tarballs
        run: ./scripts/verify-sdk-release.sh "${{ steps.release.outputs.version }}"

      - name: Upload verified dry-run packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghanageo-sdk-${{ steps.release.outputs.version }}
          path: release/npm/*.tgz
