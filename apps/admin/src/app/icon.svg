<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A favicon renders outside any document, so no currentColor and no CSS
       variables: the brand hue is written literally. oklch(0.545 0.115 168)
       converted to sRGB. -->
  <rect width="32" height="32" rx="7" fill="#0b1f1a"/>
  <g transform="translate(16 16) scale(0.78) translate(-16 -16)">
    <circle cx="16" cy="16" r="12.5" stroke="#2f9e83" stroke-width="2.4" fill="none" opacity="0.42"/>
    <ellipse cx="16" cy="16" rx="5.5" ry="12.5" stroke="#2f9e83" stroke-width="2.4" fill="none" opacity="0.7"/>
    <path d="M3.5 16h25" stroke="#2f9e83" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>
    <circle cx="13.2" cy="19.4" r="3.8" fill="#3fd9b4"/>
  </g>
</svg>
