      summary: Page through change requests visible to the steward
      description: Contributors only receive their own proposals; actors with change:review may filter and view the whole moderation queue.
      tags: [Administration]
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/ChangeRequestState" } }
        - { name: targetKind, in: query, schema: { type: string } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: submitterId, in: query, schema: { type: string } }
        - { name: reviewerId, in: query, schema: { type: string } }
      responses:
        "200": { description: Visible change-request page, content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequestPage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAdminChangeRequest
      summary: Submit a change request with immutable source evidence
      tags: [Administration]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateChangeRequest" } } }
      responses:
        "201": { description: Submitted or idempotently replayed change request, content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequestEnvelope" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/change-requests/{id}:
    get:
      operationId: getAdminChangeRequest
      summary: Read one visible change request and its append-only history
      tags: [Administration]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Change request, content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequestEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/change-requests/{id}/transitions:
    post:
      operationId: transitionAdminChangeRequest
      summary: Apply a reviewer-only state transition using compare-and-swap
      tags: [Administration]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequestTransition" } } } }
      responses: &changeRequestMutationResponses
        "200": { description: Updated change request, content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequestEnvelope" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/change-requests/{id}/revisions:
    post:
      operationId: reviseAdminChangeRequest
      summary: Append a submitter-owned revision using compare-and-swap
      tags: [Administration]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequestRevisionInput" } } } }
      responses: *changeRequestMutationResponses
  /admin/change-requests/{id}/comments:
    post:
      operationId: commentAdminChangeRequest
      summary: Append a reviewer comment using compare-and-swap
      tags: [Administration]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequestCommentInput" } } } }
      responses: *changeRequestMutationResponses

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer gh_live_<prefix>_<secret>`.

        Keys are labelled Browser, Server or Test. Browser keys are restricted
        by origin allow-list, narrower scopes and lower quotas. A secret server
        key must never reach a client bundle.
    SessionCookie:
      type: apiKey
      in: cookie
      name: gg_session
      description: Rotating HttpOnly browser session. Mutations also require an allowed Origin.

  requestBodies:
    JsonBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/JsonObject" }
    ReasonBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason: { type: string, minLength: 1, maxLength: 1000 }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: "The stable internal identifier (ULID). Human codes are alternate identifiers, never primary keys."
      example: 01KDVDNA00N6BFFK8VF5K8YXPW
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string }
    AppId:
      name: appId
      in: path
      required: true
      schema: { type: string }
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: "Opaque cursor from a previous response's `nextCursor`."
    SearchQuery:
      name: q
      in: query
      schema: { type: string }
      description: Case-insensitive support search across safe display identifiers.
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique caller-generated key. Replays return the already committed result without duplicating audit evidence.
      schema: { type: string, minLength: 1, maxLength: 128 }
    Query:
      name: q
      in: query
      required: true
      schema: { type: string, minLength: 2 }
      description: "The search text. Abbreviations and Ghanaian orthography are normalized."
      example: tema comm 25
    Lat:
      name: lat
      in: query
      required: true
      schema: { type: number, format: double, minimum: -90, maximum: 90 }
    Lng:
      name: lng
      in: query
      required: true
      schema: { type: number, format: double, minimum: -180, maximum: 180 }

  responses:
    Success:
      description: Successful operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/JsonObject" }
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No record matches that identifier.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: The record was merged; follow `error.details.mergedInto`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Rate limit or quota exceeded.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: No valid API key or browser session was supplied.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The authenticated actor lacks the required permission.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The expected version no longer matches. Refresh before retrying with a new idempotency key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    ChangeRequestState:
      type: string
      enum: [submitted, in_review, changes_requested, approved, rejected]
    ChangeRequestEvidence:
      type: object
      additionalProperties: false
      properties:
        sourceId: { type: string }
        sourceRecordIds: { type: array, items: { type: string } }
        duplicateCandidateIds: { type: array, items: { type: string } }
        reconciliationConflictIds: { type: array, items: { type: string } }
        references: { type: array, items: { type: string } }
    ChangeRequestSnapshot:
      type: object
      required: [before, after, digest]
      properties:
        before: { $ref: "#/components/schemas/JsonObject" }
        after: { $ref: "#/components/schemas/JsonObject" }
        digest: { type: string, pattern: "^[a-f0-9]{64}$" }
    ChangeRequest:
      type: object
      required: [id, target, proposedPatch, snapshot, evidence, submitterId, state, comments, history, revisions, version, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: "^cr_[0-9A-HJKMNP-TV-Z]{26}$" }
        target:
          type: object
          required: [kind, id]
          properties: { kind: { type: string }, id: { type: string } }
        proposedPatch: { $ref: "#/components/schemas/JsonObject" }
        snapshot: { $ref: "#/components/schemas/ChangeRequestSnapshot" }
        evidence: { $ref: "#/components/schemas/ChangeRequestEvidence" }
        submitterId: { type: string }
        reviewerId: { type: string }
        state: { $ref: "#/components/schemas/ChangeRequestState" }
        comments: { type: array, items: { $ref: "#/components/schemas/ChangeRequestComment" } }
        history: { type: array, items: { $ref: "#/components/schemas/ChangeRequestHistoryEvent" } }
        revisions: { type: array, items: { $ref: "#/components/schemas/ChangeRequestRevision" } }
        version: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChangeRequestComment:
      type: object
      required: [id, authorId, body, createdAt]
      properties: { id: { type: string }, authorId: { type: string }, body: { type: string }, createdAt: { type: string, format: date-time } }
    ChangeRequestHistoryEvent:
      type: object
      required: [id, to, actorId, createdAt]
      properties: { id: { type: string }, from: { $ref: "#/components/schemas/ChangeRequestState" }, to: { $ref: "#/components/schemas/ChangeRequestState" }, actorId: { type: string }, comment: { type: string }, createdAt: { type: string, format: date-time } }
    ChangeRequestRevision:
      type: object
      required: [number, proposedPatch, snapshot, evidence, actorId, createdAt]
      properties: { number: { type: integer, format: int64, minimum: 1 }, proposedPatch: { $ref: "#/components/schemas/JsonObject" }, snapshot: { $ref: "#/components/schemas/ChangeRequestSnapshot" }, evidence: { $ref: "#/components/schemas/ChangeRequestEvidence" }, actorId: { type: string }, createdAt: { type: string, format: date-time } }
    ChangeRequestEnvelope:
      type: object
      required: [data]
      properties: { data: { $ref: "#/components/schemas/ChangeRequest" } }
    ChangeRequestPage:
      type: object
      required: [data]
      properties: { data: { type: array, items: { $ref: "#/components/schemas/ChangeRequest" } }, nextCursor: { type: string } }
    CreateChangeRequest:
      type: object
      additionalProperties: false
      required: [target, proposedPatch, before, after, evidence]
      properties:
        target: { type: object, required: [kind, id], properties: { kind: { type: string }, id: { type: string } } }
        proposedPatch: { $ref: "#/components/schemas/JsonObject" }
        before: { $ref: "#/components/schemas/JsonObject" }
        after: { $ref: "#/components/schemas/JsonObject" }
        evidence: { $ref: "#/components/schemas/ChangeRequestEvidence" }
    ChangeRequestTransition:
      type: object
      additionalProperties: false
      required: [expectedVersion, state]
      properties: { expectedVersion: { type: integer, format: int64, minimum: 1 }, state: { type: string, enum: [in_review, changes_requested, approved, rejected] }, comment: { type: string } }
    ChangeRequestRevisionInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, proposedPatch, after, evidence]
      properties: { expectedVersion: { type: integer, format: int64, minimum: 1 }, proposedPatch: { $ref: "#/components/schemas/JsonObject" }, after: { $ref: "#/components/schemas/JsonObject" }, evidence: { $ref: "#/components/schemas/ChangeRequestEvidence" }, comment: { type: string } }
    ChangeRequestCommentInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, body]
      properties: { expectedVersion: { type: integer, format: int64, minimum: 1 }, body: { type: string, minLength: 1 } }
    FairUseAllowance:
      type: object
      additionalProperties: false
      required: [burstUnits, refillPerSecond, windowSeconds]
      properties:
        burstUnits: { type: integer, minimum: 1 }
        refillPerSecond: { type: number, exclusiveMinimum: 0 }
        windowSeconds: { type: integer, minimum: 1 }
    FairUseCostCeilings:
      type: object
      additionalProperties: false
      required: [cheap, normal, spatial, geometry]
      properties:
        cheap: { type: integer, minimum: 0 }
        normal: { type: integer, minimum: 0 }
        spatial: { type: integer, minimum: 0 }
        geometry: { type: integer, minimum: 0 }
    FairUsePolicyInput:
      type: object
      additionalProperties: false
      required: [revision, anonymous, authenticated, sandbox, costCeilings, reason, effectiveFrom]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        anonymous: { $ref: "#/components/schemas/FairUseAllowance" }
        authenticated: { $ref: "#/components/schemas/FairUseAllowance" }
        sandbox: { $ref: "#/components/schemas/FairUseAllowance" }
        costCeilings: { $ref: "#/components/schemas/FairUseCostCeilings" }
        reason: { type: string, minLength: 1 }
        effectiveFrom: { type: string, format: date-time }
    FairUsePolicy:
      allOf:
        - { $ref: "#/components/schemas/FairUsePolicyInput" }
        - type: object
          required: [id, actorId, createdAt]
          properties:
            id: { type: string, const: public-default }
            actorId: { type: string }
            createdAt: { type: string, format: date-time }
    FairUseOverrideInput:
      type: object
      additionalProperties: false
      required: [applicationId, allowance, costCeilings, enabled, reason, expiresAt]
      properties:
        id: { type: string, description: Optional client idempotency identifier. }
        applicationId: { type: string, minLength: 1 }
        allowance: { $ref: "#/components/schemas/FairUseAllowance" }
        costCeilings: { $ref: "#/components/schemas/FairUseCostCeilings" }
        enabled: { type: boolean }
        reason: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
        supersedesId: { type: string }
    JsonObject:
      type: object
      additionalProperties: true

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }

    PasswordResetConfirmation:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 32, maxLength: 256 }
        password:
          type: string
          minLength: 12
          maxLength: 1024
          description: Must satisfy the server password policy; never logged or returned.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, docs]
          properties:
            code:
              type: string
              description: A stable machine code from contracts/errors/catalog.yaml.
              enum:
                [INVALID_ARGUMENT, INVALID_COORDINATES, RADIUS_OUT_OF_RANGE, QUERY_TOO_SHORT,
                 PAYLOAD_TOO_LARGE, UNAUTHENTICATED, KEY_REVOKED, PERMISSION_DENIED,
                 ORIGIN_NOT_ALLOWED, NOT_FOUND, RESOURCE_GONE, RATE_LIMIT_EXCEEDED,
                 QUOTA_EXCEEDED, QUERY_TOO_COMPLEX, DEADLINE_EXCEEDED, INTERNAL]
            message: { type: string }
            requestId: { type: string, description: "Quote this when contacting support." }
            details: { type: object, additionalProperties: true }
            docs: { type: string, format: uri-reference }

    Coordinate:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }

    Ref:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    Provenance:
      type: object
      required: [sourceId]
      description: Where this record came from. A record without provenance cannot be published.
      properties:
        sourceId: { type: string }
        sourceUrl: { type: string, format: uri }
        retrievedAt: { type: string }

    Status:
      type: string
      enum: [ACTIVE, DEPRECATED, MERGED]

    VerificationStatus:
      type: string
      description: |
        How far a record has moved toward canonical truth.
        `SEED_NEEDS_CANONICAL_RECONCILIATION` rows are bootstrap data awaiting
        official GNHR/GSS reconciliation and are never auto-promoted.
      enum: [REFERENCE, SEED_NEEDS_CANONICAL_RECONCILIATION, REVIEWED, CANONICAL]

    PlaceType:
      type: string
      enum: [CITY, TOWN, VILLAGE, COMMUNITY, SUBURB, NEIGHBOURHOOD, HAMLET, SETTLEMENT, LOCALITY, REGIONAL_CAPITAL]

    Region:
      type: object
      required: [id, countryCode, name, status, verificationStatus, provenance, datasetVersion]
      properties:
        id: { type: string }
        countryCode: { type: string, example: GH }
        name: { type: string }
        capital: { type: string }
        code: { type: string, description: "Official code where reconciled." }
        status: { $ref: "#/components/schemas/Status" }
        verificationStatus: { $ref: "#/components/schemas/VerificationStatus" }
        centroid: { $ref: "#/components/schemas/Coordinate" }
        provenance: { $ref: "#/components/schemas/Provenance" }
        datasetVersion: { type: string }

    District:
      type: object
      required: [id, name, region, status, verificationStatus, provenance, datasetVersion]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        type: { type: string, description: "Metropolitan, Municipal or District." }
        capital: { type: string }
        region: { $ref: "#/components/schemas/Ref" }
        status: { $ref: "#/components/schemas/Status" }
        verificationStatus: { $ref: "#/components/schemas/VerificationStatus" }
        centroid: { $ref: "#/components/schemas/Coordinate" }
        provenance: { $ref: "#/components/schemas/Provenance" }
        datasetVersion: { type: string }

    Alias:
      type: object
      required: [value]
      properties:
        id: { type: string }
        placeId: { type: string }
        value: { type: string, description: "Preserves the true orthography, including Twi, Ga and Ewe characters." }
        type: { type: string }
        language: { type: string, example: tw }
        isPreferred: { type: boolean }
        status: { $ref: "#/components/schemas/Status" }

    BoundaryGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon, MultiPolygon] }
        coordinates: { type: array, items: {}, description: GeoJSON coordinate arrays in longitude-latitude order. }
    BoundaryEnvelope:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - { $ref: "#/components/schemas/BoundaryGeometry" }
            - { type: "null" }

    Place:
      type: object
      required: [id, name, normalizedName, type, aliases, status, verificationStatus, provenance, datasetVersion]
      properties:
        id: { type: string }
        name: { type: string }
        normalizedName: { type: string, description: "Deterministic search token; folded for matching only." }
        type: { $ref: "#/components/schemas/PlaceType" }
        region: { $ref: "#/components/schemas/Ref" }
        district: { $ref: "#/components/schemas/Ref" }
        parentPlaceId: { type: string }
        aliases:
          type: array
          items: { $ref: "#/components/schemas/Alias" }
        centroid: { $ref: "#/components/schemas/Coordinate" }
        population: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/Status" }
        verificationStatus: { $ref: "#/components/schemas/VerificationStatus" }
        provenance: { $ref: "#/components/schemas/Provenance" }
        datasetVersion: { type: string }

    SearchResult:
      allOf:
        - $ref: "#/components/schemas/Place"
        - type: object
          properties:
            score: { type: number, format: double, description: "Confidence, 0 to 1." }
            matchReason: { type: string, description: 'Why this matched, e.g. "alias match: Osu RE".' }

    PageMeta:
      type: object
      required: [datasetVersion]
      properties:
        nextCursor: { type: string }
        datasetVersion: { type: string }

    RegionPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/Region" } }

    DistrictPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/District" } }

    PlacePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/Place" } }

    SearchPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/SearchResult" } }

    ReverseResult:
      type: object
      required: [datasetVersion]
      properties:
        region: { $ref: "#/components/schemas/Ref" }
        district: { $ref: "#/components/schemas/Ref" }
        nearby:
          type: array
          items: { $ref: "#/components/schemas/Place" }
        datasetVersion: { type: string }

    BoundaryFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type: { type: string, const: Feature }
        geometry:
          type: object
          description: GeoJSON geometry in WGS84 (EPSG:4326).
          required: [type, coordinates]
          properties:
            type:
              type: string
              enum: [Point, LineString, Polygon, MultiPoint, MultiLineString, MultiPolygon]
            coordinates: { type: array, items: {} }
        properties:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            datasetVersion: { type: string }
            attribution: { type: string, description: "Required for ODbL and CC BY derived geometry." }

    DatasetVersion:
      type: object
      required: [version, status]
      properties:
        version: { type: string, example: "2026.08.1" }
        status: { type: string, enum: [draft, validation, review, approved, published, rolled_back] }
        publishedAt: { type: string, format: date-time }
        changelog: { type: string }
        checksum: { type: string }

    DatasetPage:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/DatasetVersion" } }

    DownloadList:
      type: object
      required: [version, downloads]
      properties:
        version: { type: string }
        downloads:
          type: array
          items:
            type: object
            required: [format, url, checksum]
            properties:
              format: { type: string, enum: [json, csv, geojson, parquet] }
              url: { type: string, format: uri }
              sizeBytes: { type: integer, format: int64 }
              checksum: { type: string }
              attribution: { type: string }
