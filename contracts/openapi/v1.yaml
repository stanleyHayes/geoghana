        - { name: kind, in: path, required: true, schema: { type: string, enum: [region, district] } }
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Boundary and a strong ETag used for compare-and-swap
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/BoundaryEnvelope" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateAdminBoundary
      summary: Replace a canonical region or district boundary with compare-and-swap
      description: Requires an authenticated MFA-complete steward session with geography:edit and geometry:edit permissions. Invalid coordinates and self-intersecting polygons are rejected before persistence.
      tags: [Administration]
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [region, district] } }
        - { $ref: "#/components/parameters/Id" }
        - { name: If-Match, in: header, required: true, schema: { type: string }, description: Strong ETag returned by GET. }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BoundaryGeometry" } } }
      responses:
        "200":
          description: Updated boundary
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/BoundaryEnvelope" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
