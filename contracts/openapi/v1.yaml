openapi: 3.1.0
info:
  title: GhanaGeo API
  version: "1.0.0"
  summary: National location data for Ghana — regions, districts, places, aliases and boundaries.
  description: |
    GhanaGeo serves canonical Ghanaian geography. Every response carries the
    dataset version it was served from, and every record carries source
    provenance.

    REST, GraphQL and gRPC are transport adapters over one shared application
    layer, so equivalent queries return semantically identical results.

    **Licensing note.** GhanaPostGPS digital addresses are not included and are
    not redistributed. Derived OpenStreetMap data carries ODbL attribution;
    GeoNames-derived names carry CC BY attribution.
  license:
    name: See per-record provenance and the licensing register
    url: https://geo.digitalghana.dev/about/open-data
  contact:
    name: GhanaGeo
    url: https://geo.digitalghana.dev

servers:
  - url: https://api.geo.digitalghana.dev/v1
    description: Production
  - url: https://sandbox.geo.digitalghana.dev/v1
    description: Sandbox — capped dataset, aggressive limits
  - url: "http://localhost:8180/v1"
    description: Local development

security:
  - ApiKeyAuth: []

tags:
  - name: Geography
    description: Regions, districts and places.
  - name: Spatial
    description: Proximity and containment queries.
  - name: Datasets
    description: Published dataset versions and downloads.
  - name: Accounts
    description: Developer account, session, MFA and passkey lifecycle.
  - name: Developer
    description: Organizations, applications, API keys and attributed usage.
  - name: Administration
    description: Session-authenticated steward geography operations.

paths:
  /regions:
    get:
      operationId: listRegions
      summary: List Ghana's regions
      tags: [Geography]
      description: Returns the 16 regions. Cost class **cheap** (1 unit).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of regions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegionPage" }
        "401": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /regions/{id}:
    get:
      operationId: getRegion
      summary: Get one region
      tags: [Geography]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The region.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Region" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }

  /regions/{id}/districts:
    get:
      operationId: listRegionDistricts
      summary: List districts in a region
      tags: [Geography]
      description: |
        Returns `404` for an unknown region rather than an empty list, so a
        typo is distinguishable from a genuinely empty region.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of districts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistrictPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /districts:
    get:
      operationId: listDistricts
      summary: List and filter districts (MMDAs)
      tags: [Geography]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: regionId
          in: query
          schema: { type: string }
          description: "Restrict to one region."
        - name: q
          in: query
          schema: { type: string }
          description: "Prefix match on the normalized name."
      responses:
        "200":
          description: A page of districts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistrictPage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /districts/{id}:
    get:
      operationId: getDistrict
      summary: Get one district
      tags: [Geography]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The district.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/District" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }

  /districts/{id}/places:
    get:
      operationId: listDistrictPlaces
      summary: List places in a district
      tags: [Geography]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/PlaceType" }
      responses:
        "200":
          description: A page of places.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacePage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /places:
    get:
      operationId: listPlaces
      summary: List and filter places
      tags: [Geography]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: districtId
          in: query
          schema: { type: string }
        - name: regionId
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/PlaceType" }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of places.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacePage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /places/{id}:
    get:
      operationId: getPlace
      summary: Resolve a place
      tags: [Geography]
      description: |
        A merged or deprecated identifier returns `410` with
        `error.details.mergedInto`, so stored ids keep resolving.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The place.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Place" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }

  /search:
    get:
      operationId: search
      summary: Full and fuzzy location search
      tags: [Spatial]
      description: |
        Typo-tolerant search across names and aliases. Every result carries a
        confidence score and a match explanation. Ambiguous queries return
        multiple candidates rather than a guess. Cost class **normal** (2).
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Limit"
        - name: regionId
          in: query
          schema: { type: string }
          description: "Bias ranking toward this region."
        - name: districtId
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/PlaceType" }
      responses:
        "200":
          description: Ranked candidates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchPage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /autocomplete:
    get:
      operationId: autocomplete
      summary: Low-latency typeahead suggestions
      tags: [Spatial]
      description: Target p95 under 200 ms. Cost class **normal** (2).
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Suggestions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchPage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /geocode:
    get:
      operationId: geocode
      summary: Text to ranked geographic candidates
      tags: [Spatial]
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Ranked candidates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchPage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /reverse:
    get:
      operationId: reverseGeocode
      summary: Coordinates to containing geography
      tags: [Spatial]
      description: |
        Returns the containing region and district plus nearby localities.
        Coordinates outside Ghana return an empty result, not an error.
        Cost class **spatial** (4).
      parameters:
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lng"
      responses:
        "200":
          description: Containing geography and nearby places.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReverseResult" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /nearby:
    get:
      operationId: nearby
      summary: Spatial proximity search
      tags: [Spatial]
      description: Cost class **spatial** (4).
      parameters:
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lng"
        - name: radius
          in: query
          schema: { type: integer, default: 5000, minimum: 1, maximum: 50000 }
          description: "Radius in metres."
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Nearby places, nearest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacePage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /boundaries/{id}:
    get:
      operationId: getBoundary
      summary: GeoJSON boundary for a region, district or place
      tags: [Spatial]
      description: Cost class **geometry** (5–10, by vertex count).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: A GeoJSON Feature.
          content:
            application/geo+json:
              schema: { $ref: "#/components/schemas/BoundaryFeature" }
        "404": { $ref: "#/components/responses/NotFound" }

  /datasets:
    get:
      operationId: listDatasets
      summary: Published dataset versions
      tags: [Datasets]
      responses:
        "200":
          description: Published versions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetPage" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /datasets/{version}/downloads:
    get:
      operationId: listDatasetDownloads
      summary: Bulk download metadata for a dataset version
      tags: [Datasets]
      parameters:
        - name: version
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}\.\d{2}\.\d+(?:-[a-z0-9-]+)?$' }
          example: "2026.08.1"
      responses:
        "200":
          description: Available formats with checksums and attribution.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadList" }
        "404": { $ref: "#/components/responses/NotFound" }

  /roads:
    get:
      operationId: listRoads
      summary: List OpenStreetMap-derived roads
      tags: [Geography]
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }

  /pois:
    get:
      operationId: listPointsOfInterest
      summary: List OpenStreetMap-derived points of interest
      tags: [Geography]
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }

  /datasets/{version}/downloads/{entity}.{format}:
    get:
      operationId: downloadDatasetArtifact
      summary: Stream one published dataset artifact
      tags: [Datasets]
      parameters:
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: entity, in: path, required: true, schema: { type: string, enum: [regions, districts, places] } }
        - { name: format, in: path, required: true, schema: { type: string, enum: [json, csv, geojson] } }
      responses:
        "200": { description: The immutable artifact bytes. }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/register:
    post:
      operationId: registerAccount
      summary: Register a developer account
      tags: [Accounts]
      security: []
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "201": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/BadRequest" } }
  /auth/verify:
    post:
      operationId: verifyEmail
      summary: Verify an account email address
      tags: [Accounts]
      security: []
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/BadRequest" } }
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Request a password-reset email
      description: Always returns the same accepted response, whether or not the address belongs to an account.
      tags: [Accounts]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "202": { $ref: "#/components/responses/Success" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Replace a password using a single-use reset token
      description: A successful reset revokes every existing browser session for the account.
      tags: [Accounts]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirmation" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/login:
    post:
      operationId: login
      summary: Start a browser session
      tags: [Accounts]
      security: []
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /auth/mfa/totp:
    post:
      operationId: completeTotpChallenge
      summary: Complete login with a TOTP code
      tags: [Accounts]
      security: []
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /auth/mfa/recover:
    post:
      operationId: completeRecoveryChallenge
      summary: Complete login with a single-use recovery code
      tags: [Accounts]
      security: []
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /auth/mfa/enrol:
    post:
      operationId: enrolTotp
      summary: Enrol TOTP for the current account
      tags: [Accounts]
      security: [{ SessionCookie: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [Accounts]
      security: [{ SessionCookie: [] }]
      responses: { "204": { description: Session revoked. }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke every account session
      tags: [Accounts]
      security: [{ SessionCookie: [] }]
      responses: { "204": { description: Sessions revoked. }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /auth/session:
    get:
      operationId: getSession
      summary: Read the current account session
      tags: [Accounts]
      security: [{ SessionCookie: [] }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /auth/sessions:
    get:
      operationId: listSessions
      summary: List active account sessions
      tags: [Accounts]
      security: [{ SessionCookie: [] }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }

  /auth/passkeys/register/begin:
    post:
      operationId: beginPasskeyRegistration
      summary: Begin passkey registration
      tags: [Accounts]
      security: [{ SessionCookie: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /auth/passkeys/register/finish:
    post:
      operationId: finishPasskeyRegistration
      summary: Finish passkey registration
      tags: [Accounts]
      security: [{ SessionCookie: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/BadRequest" } }
  /auth/passkeys/login/begin:
    post:
      operationId: beginPasskeyLogin
      summary: Begin passkey login
      tags: [Accounts]
      security: []
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/BadRequest" } }
  /auth/passkeys/login/finish:
    post:
      operationId: finishPasskeyLogin
      summary: Finish passkey login
      tags: [Accounts]
      security: []
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /auth/passkeys:
    get:
      operationId: listPasskeys
      summary: List registered passkeys
      tags: [Accounts]
      security: [{ SessionCookie: [] }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /auth/passkeys/{id}:
    delete:
      operationId: deletePasskey
      summary: Remove a registered passkey
      tags: [Accounts]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: Passkey removed. }, "404": { $ref: "#/components/responses/NotFound" } }

  /developer/organizations:
    get:
      operationId: listDeveloperOrganizations
      summary: List organizations for the current member
      tags: [Developer]
      security: [{ SessionCookie: [] }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
    post:
      operationId: createDeveloperOrganization
      summary: Create an organization
      tags: [Developer]
      security: [{ SessionCookie: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "201": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /developer/organizations/{orgId}/invitations:
    get:
      operationId: listOrganizationInvitations
      summary: List organization invitations
      tags: [Developer]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
    post:
      operationId: inviteOrganizationMember
      summary: Invite an organization member
      tags: [Developer]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "201": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /developer/organizations/{orgId}/invitations/{inviteId}/revoke:
    post:
      operationId: revokeOrganizationInvitation
      summary: Revoke a pending invitation
      tags: [Developer]
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { name: inviteId, in: path, required: true, schema: { type: string } }
      responses: { "204": { description: Invitation revoked. }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /developer/organizations/{orgId}/transfer-ownership:
    post:
      operationId: transferOrganizationOwnership
      summary: Transfer organization ownership
      tags: [Developer]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /developer/invitations/accept:
    post:
      operationId: acceptOrganizationInvitation
      summary: Accept an organization invitation
      tags: [Developer]
      security: [{ SessionCookie: [] }]
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /developer/organizations/{orgId}/applications:
    get:
      operationId: listDeveloperApplications
      summary: List organization applications
      tags: [Developer]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
    post:
      operationId: createDeveloperApplication
      summary: Create an application
      tags: [Developer]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "201": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /developer/organizations/{orgId}/applications/{appId}/keys:
    get:
      operationId: listApplicationKeys
      summary: List application API keys
      tags: [Developer]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }, { $ref: "#/components/parameters/AppId" }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
    post:
      operationId: createApplicationKey
      summary: Create an API key; its secret is returned once
      tags: [Developer]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }, { $ref: "#/components/parameters/AppId" }]
      requestBody: { $ref: "#/components/requestBodies/JsonBody" }
      responses: { "201": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /developer/organizations/{orgId}/applications/{appId}/keys/{keyId}/rotate:
    post:
      operationId: rotateApplicationKey
      summary: Rotate an API key and return the new secret once
      tags: [Developer]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }, { $ref: "#/components/parameters/AppId" }, { $ref: "#/components/parameters/KeyId" }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /developer/organizations/{orgId}/applications/{appId}/keys/{keyId}/revoke:
    post:
      operationId: revokeApplicationKey
      summary: Revoke an API key immediately
      tags: [Developer]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }, { $ref: "#/components/parameters/AppId" }, { $ref: "#/components/parameters/KeyId" }]
      responses: { "204": { description: Key revoked. }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /developer/organizations/{orgId}/applications/{appId}/usage:
    get:
      operationId: getApplicationUsage
      summary: Read attributed application usage
      tags: [Developer]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }, { $ref: "#/components/parameters/AppId" }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }
  /developer/organizations/{orgId}/applications/{appId}/requests:
    get:
      operationId: listApplicationRequests
      summary: Page through secret-free application request logs
      tags: [Developer]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }, { $ref: "#/components/parameters/AppId" }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthenticated" } }

  /admin/permissions:
    get:
      operationId: getAdminPermissions
      summary: Read effective steward permissions
      tags: [Administration]
      security: [{ SessionCookie: [] }]
