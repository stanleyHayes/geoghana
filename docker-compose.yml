name: ghanageo

services:
  mongo:
    image: mongo:8.0
    container_name: ghanageo-mongo
    # A single-node replica set: multi-document transactions require one,
    # and the merge/redirect and release-publish paths are transactional.
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["27117:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first healthy check, then reports status.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      # mongosh takes several seconds to start when Docker is under memory
      # pressure from other projects, so the probe needs room. The replica set
      # stays healthy throughout; only the probe was timing out.
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: ghanageo-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6679:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  typesense:
    image: typesense/typesense:29.0
    container_name: ghanageo-typesense
    command: ["--data-dir", "/data", "--api-key", "ghanageo_local_dev_only", "--enable-cors"]
    ports: ["8108:8108"]
    volumes:
      - typesense-data:/data
    healthcheck:
      # The Typesense image ships neither wget nor curl, but does ship bash,
      # so probe the port with bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghanageo-api:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghanageo-api
    environment:
      GHANAGEO_ENV: local
      GHANAGEO_SERVE_MODE: all
      MONGO_URI: mongodb://mongo:27017/ghanageo?replicaSet=rs0&directConnection=true
      MONGO_DB: ghanageo
      REDIS_URL: redis://redis:6379
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ghanageo_local_dev_only
      API_HTTP_PORT: "8180"
      API_GRPC_PORT: "9190"
      API_EXPORT_DIR: /var/lib/ghanageo/exports
      API_ALLOWED_ORIGINS: http://localhost:3100,http://localhost:3101,http://localhost:3102,http://localhost:3103
      OTEL_TRACES_EXPORTER: none
    ports:
      - "8180:8180"
      - "9190:9190"
    volumes:
      - ./data/exports:/var/lib/ghanageo/exports:ro
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8180/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    image: ghanageo-api:local
    container_name: ghanageo-worker
    entrypoint: ["/ghanageo-worker"]
    environment:
      GHANAGEO_ENV: local
      MONGO_URI: mongodb://mongo:27017/ghanageo?replicaSet=rs0&directConnection=true
      MONGO_DB: ghanageo
      REDIS_URL: redis://redis:6379
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ghanageo_local_dev_only
      DATASET_VERSION: 2026.08.3-ulid
      WORKER_POLL_INTERVAL: 1s
      WORKER_LEASE: 5m
      WORKER_RETRY_BASE: 5s
      WORKER_MAX_ATTEMPTS: "5"
      WORKER_METRICS_PORT: "9091"
      OTEL_TRACES_EXPORTER: none
    ports:
      - "9091:9091"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
  redis-data:
  typesense-data:
