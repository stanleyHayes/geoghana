[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ghanageo"
version = "2.0.0a1"
description = "Official Python SDK for the GhanaGeo location API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "GhanaGeo" }]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2"]
geopandas = ["geopandas>=1"]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "PyYAML>=6",
  "ruff>=0.8",
]

[project.urls]
Documentation = "https://docs.ghanageo.gov.gh/sdks/python"
Source = "https://github.com/ghanageo/python-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/ghanageo"]
force-include = { "contract.lock.json" = "ghanageo/contract.lock.json" }

[tool.hatch.build.targets.sdist]
include = ["src/ghanageo", "README.md", "contract.lock.json", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "E501", "S110"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ghanageo"]
